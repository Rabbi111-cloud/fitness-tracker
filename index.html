<!DOCTYPE html>
<html>
<head>
  <title>Fitness Tracker</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 500px; 
      margin: auto; 
      padding: 20px; 
      background: linear-gradient(135deg, #e0f7fa, #fff9c4); 
    }
    h1, h2, h3 { text-align: center; color: #333; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    input:focus { outline: none; border-color: #00796b; }
    button { background: #00796b; color: white; border: none; cursor: pointer; transition: 0.3s; }
    button:hover { opacity: 0.85; }
    ul { padding: 0; margin-top: 10px; }
    li { list-style: none; background: white; padding: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stats { background: white; padding: 15px; margin-top: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .delete-btn { background: #d32f2f; color: white; border: none; padding: 6px 10px; cursor: pointer; border-radius: 4px; }
    canvas { background: white; border-radius: 6px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #trackerDiv { margin-top: 20px; }
    #authMessage { color: red; text-align: center; margin-top: 5px; }
  </style>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase CDN compat scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>Fitness Tracker</h1>

  <!-- LOGIN / SIGNUP -->
  <div id="authDiv">
    <h2>Login / Signup</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>
    <p id="authMessage"></p>
  </div>

  <!-- WORKOUT TRACKER (hidden until login) -->
  <div id="trackerDiv" style="display:none;">

    <div class="stats">
      <p><strong>Total Minutes:</strong> <span id="totalMinutes">0</span></p>
      <p><strong>Total Calories:</strong> <span id="totalCalories">0</span></p>
    </div>

    <input id="workout" placeholder="Workout (e.g Running)">
    <input id="minutes" type="number" placeholder="Minutes">
    <button onclick="addWorkout()">Add Workout</button>

    <!-- Progress Chart -->
    <h3>Progress Chart</h3>
    <canvas id="progressChart" width="400" height="200"></canvas>

    <h3>My Workouts</h3>
    <ul id="list"></ul>

    <button onclick="logout()" style="margin-top:15px; background:#555;">Logout</button>
  </div>

  <script>
    // Firebase config
    var firebaseConfig = {
      apiKey: "AIzaSyB8s8CoDhWLjhrURfV8z-6Gg8ielk2oNcc",
      authDomain: "fitness-app-ad576.firebaseapp.com",
      projectId: "fitness-app-ad576",
      storageBucket: "fitness-app-ad576.appspot.com",
      messagingSenderId: "571093892763",
      appId: "1:571093892763:web:76db8ed5a20cb51d98103e"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.firestore();

    var authDiv = document.getElementById("authDiv");
    var trackerDiv = document.getElementById("trackerDiv");
    var authMessage = document.getElementById("authMessage");

    var workouts = [];
    var chart;

    // Auth state
    auth.onAuthStateChanged(function(user){
      if(user){
        authDiv.style.display = "none";
        trackerDiv.style.display = "block";
        loadWorkouts();
      } else {
        authDiv.style.display = "block";
        trackerDiv.style.display = "none";
      }
    });

    function signup(){
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email,password)
        .then(()=>{ authMessage.style.color="green"; authMessage.innerText="Signup successful!"; })
        .catch(err=>{ authMessage.style.color="red"; authMessage.innerText=err.message; });
    }

    function login(){
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email,password)
        .then(()=>{ authMessage.style.color="green"; authMessage.innerText="Login successful!"; })
        .catch(err=>{ authMessage.style.color="red"; authMessage.innerText=err.message; });
    }

    function logout(){ auth.signOut(); }

    function loadWorkouts(){
      if(!auth.currentUser) return;
      db.collection("users").doc(auth.currentUser.uid).get().then(function(doc){
        if(doc.exists){
          workouts = doc.data().workouts || [];
        } else {
          workouts = [];
        }
        showWorkouts();
      });
    }

    function showWorkouts(){
      var list = document.getElementById("list");
      list.innerHTML = "";
      var totalMinutes = 0;
      var totalCalories = 0;
      workouts.forEach(function(w,index){
        var li = document.createElement("li");
        li.innerHTML = '<span>'+w.workout+' - '+w.minutes+' min ('+w.calories+' cal)</span>'+
                       '<button class="delete-btn" onclick="deleteWorkout('+index+')">❌</button>';
        list.appendChild(li);
        totalMinutes += Number(w.minutes);
        totalCalories += Number(w.calories);
      });
      document.getElementById("totalMinutes").innerText = totalMinutes;
      document.getElementById("totalCalories").innerText = totalCalories;
      updateChart();
    }

    function addWorkout(){
      if(!auth.currentUser){ alert("Please login first!"); return; }
      var workout = document.getElementById("workout").value;
      var minutes = document.getElementById("minutes").value;
      if(!workout || !minutes){ alert("Enter both workout and minutes!"); return; }
      var calories = minutes * 7;
      workouts.push({workout:workout,minutes:minutes,calories:calories});
      db.collection("users").doc(auth.currentUser.uid).set({workouts:workouts});
      document.getElementById("workout").value="";
      document.getElementById("minutes").value="";
      showWorkouts();
    }

    function deleteWorkout(index){
      if(!auth.currentUser) return;
      workouts.splice(index,1);
      db.collection("users").doc(auth.currentUser.uid).set({workouts:workouts});
      showWorkouts();
    }

    function updateChart(){
      var labels = workouts.map(w=>w.workout);
      var data = workouts.map(w=>Number(w.minutes));
      var ctx = document.getElementById('progressChart').getContext('2d');
      if(chart) chart.destroy();
      chart = new Chart(ctx,{
        type:'bar',
        data:{ labels:labels, datasets:[{label:'Minutes', data:data, backgroundColor:'rgba(0,150,136,0.7)', borderColor:'rgba(0,150,136,1)', borderWidth:1 }] },
        options:{ scales:{ y:{ beginAtZero:true } } }
      });
    }
  </script>

</body>
</html>
